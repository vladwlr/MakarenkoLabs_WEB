<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЛР8 · Гра 1–25</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #0f172a;
      background: radial-gradient(circle at top, #e0f2fe, #f8fafc 58%, #dbeafe);
      display: grid;
      place-items: center;
    }
    .wrap {
      width: min(920px, 96%);
      background: #ffffff;
      border: 1px solid #d6e4f0;
      border-radius: 26px;
      padding: 30px;
      box-shadow: 0 22px 60px rgba(15, 23, 42, .12);
    }
    .tag {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 999px;
      background: #e0faff;
      color: #0e7490;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-size: clamp(30px, 4vw, 42px); }
    p { color: #64748b; line-height: 1.55; }
    .panel {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin: 18px 0;
    }
    .pill {
      padding: 12px 16px;
      border-radius: 14px;
      background: #ecfeff;
      color: #155e75;
      font-weight: 900;
    }
    .btn, .home {
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      background: #0891b2;
      color: #fff;
      font-weight: 900;
      cursor: pointer;
      text-decoration: none;
      font-size: 15px;
    }
    .home { background: #e0f2fe; color: #155e75; }
    .message {
      padding: 14px 16px;
      border-radius: 16px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      color: #0c4a6e;
      font-weight: 800;
      margin-bottom: 16px;
    }
    .message.bad { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
    .message.done { background: #f0fdf4; border-color: #bbf7d0; color: #166534; }
    #board {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 18px 0 24px;
    }
    .cell {
      height: 76px;
      border: 1px solid #bdd0e6;
      border-radius: 18px;
      background: #ffffff;
      color: #0f172a !important;
      display: grid;
      place-items: center;
      font-size: 25px;
      font-weight: 900;
      cursor: pointer;
      transition: .15s transform, .15s border-color, .15s background;
      box-shadow: inset 0 -2px 0 rgba(15, 23, 42, .04);
    }
    .cell:hover { transform: translateY(-2px); border-color: #0891b2; background: #f0f9ff; }
    .cell:active { transform: translateY(0); }
    .cell.ok {
      background: #bbf7d0 !important;
      color: #166534 !important;
      border-color: #86efac;
      text-decoration: line-through;
      cursor: default;
      opacity: .78;
    }
    .cell.wrong { animation: shake .25s linear; border-color: #fb923c; background: #fff7ed; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)} }
    table { width: 100%; border-collapse: collapse; background: #f8fafc; border-radius: 14px; overflow: hidden; }
    th, td { padding: 11px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    th { background: #ecfeff; color: #155e75; }
    @media (max-width: 560px) {
      .wrap { padding: 20px; }
      #board { gap: 7px; }
      .cell { height: 54px; border-radius: 12px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="tag">Макаренко Владислав · 303-ТН</div>
    <h1>Лабораторна робота 8 · Гра 1–25</h1>
    <p>Тут треба натискати числа по порядку: 1, 2, 3 ... 25. Зробив так, щоб гра запускалась одразу на сторінці.</p>

    <div class="panel">
      <div class="pill">Наступне число: <b id="nextNumber">1</b></div>
      <div class="pill">Час: <b id="timeBox">60</b> с</div>
      <button class="btn" id="restartBtn" type="button">Почати заново</button>
      <a class="home" href="../index.html">На головну</a>
    </div>

    <div id="status" class="message">Гра запущена. Починай з числа 1.</div>
    <div id="board"></div>

    <h2>Мої результати</h2>
    <table>
      <thead><tr><th>№ гри</th><th>Час</th></tr></thead>
      <tbody id="resultRows"><tr><td colspan="2">Поки результатів немає</td></tr></tbody>
    </table>
  </main>

  <script>
    const board = document.getElementById('board');
    const nextNumberBox = document.getElementById('nextNumber');
    const timeBox = document.getElementById('timeBox');
    const statusBox = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');
    const resultRows = document.getElementById('resultRows');

    let current = 1;
    let secondsLeft = 60;
    let timer = null;
    let round = 1;
    let resultIsEmpty = true;
    let gameActive = true;

    function shuffleNumbers() {
      const arr = Array.from({ length: 25 }, (_, i) => i + 1);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function setMessage(text, type = '') {
      statusBox.className = 'message' + (type ? ' ' + type : '');
      statusBox.textContent = text;
    }

    function buildBoard() {
      board.innerHTML = '';
      shuffleNumbers().forEach(number => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cell';
        btn.textContent = number;
        btn.addEventListener('click', () => chooseNumber(btn, number));
        board.appendChild(btn);
      });
    }

    function chooseNumber(btn, number) {
      if (!gameActive || btn.classList.contains('ok')) return;

      if (number !== current) {
        setMessage('Спочатку треба натиснути ' + current + ', а не ' + number + '.', 'bad');
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 300);
        return;
      }

      btn.classList.add('ok');
      btn.disabled = true;
      current++;

      if (current <= 25) {
        nextNumberBox.textContent = current;
        setMessage('Добре. Тепер шукай число ' + current + '.');
      } else {
        finishGame();
      }
    }

    function startTimer() {
      clearInterval(timer);
      secondsLeft = 60;
      timeBox.textContent = secondsLeft;
      timer = setInterval(() => {
        secondsLeft--;
        timeBox.textContent = secondsLeft;
        if (secondsLeft <= 0) {
          clearInterval(timer);
          gameActive = false;
          setMessage('Час вийшов. Натисни «Почати заново».', 'bad');
        }
      }, 1000);
    }

    function finishGame() {
      clearInterval(timer);
      gameActive = false;
      nextNumberBox.textContent = 'готово';
      const spent = 60 - secondsLeft;

      if (resultIsEmpty) {
        resultRows.innerHTML = '';
        resultIsEmpty = false;
      }
      const row = document.createElement('tr');
      row.innerHTML = '<td>' + round + '</td><td>' + spent + ' с</td>';
      resultRows.appendChild(row);
      round++;
      setMessage('Готово. Твій час: ' + spent + ' секунд.', 'done');
    }

    function restartGame() {
      current = 1;
      gameActive = true;
      nextNumberBox.textContent = current;
      setMessage('Гра запущена. Починай з числа 1.');
      buildBoard();
      startTimer();
    }

    restartBtn.addEventListener('click', restartGame);
    restartGame();
  </script>
</body>
</html>
