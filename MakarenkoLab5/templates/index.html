<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЛР5 · Flask</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#111827}.card{width:min(520px,92%);background:white;border-radius:26px;padding:28px;box-shadow:0 25px 70px rgba(0,0,0,.28)}.label{color:#2563eb;font-weight:800}.row{display:flex;gap:10px;margin-top:18px}input{flex:1;padding:13px 14px;border-radius:14px;border:1px solid #cbd5e1;font-size:17px}button{border:0;border-radius:14px;background:#2563eb;color:white;font-weight:800;padding:0 18px;cursor:pointer}.result{margin-top:18px;padding:16px;border-radius:16px;background:#f1f5f9;color:#334155;min-height:54px}.small{color:#64748b}
  </style>
</head>
<body>
  <main class="card">
    <div class="label">Лабораторна робота 5</div>
    <h1>Запит до Flask-сервера</h1>
    <p><b>Макаренко Владислав, 303-ТН</b></p>
    <p class="small">Вводжу число, фронтенд відправляє його на сервер і отримує квадрат.</p>
    <div class="row">
      <input id="numberInput" type="number" placeholder="Наприклад, 12">
      <button id="sendBtn">Порахувати</button>
    </div>
    <div id="answer" class="result">Результат буде тут</div>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
