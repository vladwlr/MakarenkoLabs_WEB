<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ЛР2 · Блоки</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Segoe UI,Arial,sans-serif;background:#111827;color:white}.wrap{width:min(880px,92%)}h1{margin-bottom:4px}.sub{color:#cbd5e1;margin-bottom:22px}.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.box{min-height:130px;border:1px solid rgba(255,255,255,.18);border-radius:22px;background:#1f2937;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:.2s transform,.2s background,.2s box-shadow;font-size:18px;font-weight:700}.box:hover{transform:translateY(-3px)}.red{background:#dc2626;box-shadow:0 16px 35px rgba(220,38,38,.28)}.green{background:#16a34a;box-shadow:0 16px 35px rgba(22,163,74,.28)}</style></head><body><main class="wrap"><h1>Перемикання кольору блоків</h1><div class="sub">Макаренко Владислав, 303-ТН. Кожен клік змінює стан елемента.</div><div class="boxes"><div class="box">Блок 1<br>натисни мене</div><div class="box">Блок 2<br>натисни мене</div><div class="box">Блок 3<br>натисни мене</div></div></main><script>document.querySelectorAll('.box').forEach((card,index)=>{let isGreen=false;card.addEventListener('click',()=>{isGreen=!isGreen;card.classList.toggle('green',isGreen);card.classList.toggle('red',!isGreen);card.innerHTML=`Блок ${index+1}<br>${isGreen?'зелений':'червоний'}`;});});</script></body></html>
